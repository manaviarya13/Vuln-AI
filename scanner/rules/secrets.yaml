rules:
  - id: vulnai.python.hardcoded-secret
    languages: [python]
    severity: WARNING
    message: A hardcoded credential-like value was found. Load secrets from a protected configuration source.
    pattern-regex: (?i)\b(?:api[_-]?key|password|passwd|secret|access[_-]?token|client[_-]?secret)\b\s*[:=]\s*(?:'[^'\n]{6,}'|"[^"\n]{6,}")
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-798"
  - id: vulnai.javascript.hardcoded-secret
    languages: [javascript, typescript]
    severity: WARNING
    message: A hardcoded credential-like value was found. Load secrets from a protected configuration source.
    pattern-regex: (?i)\b(?:api[_-]?key|password|passwd|secret|access[_-]?token|client[_-]?secret)\b\s*[:=]\s*(?:'[^'\n]{6,}'|"[^"\n]{6,}")
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-798"
